name: CI - TrustFlow

on:
  push:
    branches: 
      - "**"
  pull_request:
    branches: [ "main", "master" ]

jobs:
  tests:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, redis
          coverage: none

      - name: Install Dependencies (Host)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create .env file
        run: cp .env.example .env

      - name: Start Sail Containers
        run: php vendor/bin/sail up -d

      - name: Wait for MySQL
        run: |
          until php vendor/bin/sail mysqladmin ping -h 127.0.0.1 --silent; do
            echo "Aguardando MySQL..."
            sleep 2
          done

      - name: Prepare Application
        run: |
          php vendor/bin/sail artisan key:generate
          php vendor/bin/sail artisan migrate --force
          php vendor/bin/sail artisan db:seed --force

      - name: Run Feature Tests
        run: |
          php vendor/bin/sail artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: mysql
          CACHE_STORE: redis
          REDIS_HOST: redis
          QUEUE_CONNECTION: sync

      - name: Smoke Test (Health Check)
        run: |
          sleep 5
          curl --fail http://localhost || exit 1

      - name: Cleanup
        if: always()
        run: php vendor/bin/sail down